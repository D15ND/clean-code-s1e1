<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Todo App</title>
  </head>
  <body>
    <header class="header">
      <img class="header__img" src="./eisenhower-matrix.jpg" alt="eisenhower-matrix-image">
      <a class="header__link" href="https://goal-life.com/page/method/matrix-eisenhower">
        Want more details?</a>
    </header>
    <main class="main">
      <section class="adding">
        <h3 class="adding__title title">Add Item</h3>
        <div class="adding__wrapper">
          <input class="task__input input__new input" id="new-task" type="text">
          <button class="btn__adding btn">Add</button>
        </div>
      </section>
      <section class="todo">
        <h3 class="title">Todo</h3>
        <ul class="incomplete-tasks list">
          <li class="list__item task">
            <input class="task__checkbox input" type="checkbox">
            <label class="task__label">Pay Bills</label>
            <input class="task__input input" type="text">
            <button class="btn__edit btn">Edit</button>
            <button class="btn__delete btn">
              <img class="img__delete" src="./remove.svg" alt="remove-button">
            </button>
          </li>
          <li class="edit-mode list__item">
            <input class="task__checkbox input" type="checkbox">
            <label class="task__label">Go Shopping</label>
            <input class="task__input input" type="text" value="Go Shopping">
            <button class="btn__edit btn">Save</button>
            <button class="btn__delete btn">
              <img class="img__delete" src="./remove.svg" alt="remove-button">
            </button>
          </li>
        </ul>
      </section>
      <section class="complited">
        <h3 class="title">Completed</h3>
        <ul class="completed-tasks list">
          <li class="list__item task">
            <input class="task__checkbox input" type="checkbox" checked>
            <label class="task__label">See the Doctor</label>
            <input class="task__input input" type="text">
            <button class="btn__edit btn">Edit</button>
            <button class="btn__delete btn">
              <img class="img__delete" src="./remove.svg" alt="remove-button">
            </button>
          </li>
        </ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
